<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZenZone</title>
    <script type="text/javascript">
      // GitHub Pages 404 fallback for HashRouter.
      // Keeps the first path segment (FocusZone-Website) and redirects the rest to the hash route.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/#' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
        l.search + l.hash
      );
    </script>
  </head>
  <body>
    Redirecting to ZenZone...
  </body>
</html>
